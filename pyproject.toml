[project]
name = "nem-predispatch-bess-advisor-analysis"
version = "0.1.0"
description = "離線分析層：量化影響 NSW1 每日套利收益的因素，並以 HiGHS 求權重"
requires-python = ">=3.12"
dependencies = [
    "highspy>=1.15.1",
    "numpy>=2.5.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["analysis/tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
